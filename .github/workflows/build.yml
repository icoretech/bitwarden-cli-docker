name: Build and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: ghcr.io/icoretech/bitwarden-cli-docker
      VAULTWARDEN_IMAGE: vaultwarden/server:1.37.4-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js for compatibility tests
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Check scripts and entrypoint contract
        run: |
          shellcheck entrypoint.sh tests/entrypoint_test.sh
          sh tests/entrypoint_test.sh
          node --check tests/vaultwarden_test.mjs

      - name: Resolve tracked Bitwarden CLI version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ARG BW_VERSION=//p' Dockerfile)"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2}$'; then
            echo "Could not parse BW_VERSION from Dockerfile" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate upstream Bitwarden CLI release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/bitwarden/clients/releases/tags/cli-v${{ steps.version.outputs.version }}" --jq '.tag_name'

      - name: Build local image for compatibility tests
        uses: docker/build-push-action@v7
        with:
          load: true
          platforms: linux/amd64
          tags: bitwarden-cli-contract:local
          build-args: BW_VERSION=${{ steps.version.outputs.version }}

      - name: Test login, unlock, sync and serve against Vaultwarden
        env:
          CLI_IMAGE: bitwarden-cli-contract:local
        run: node tests/vaultwarden_test.mjs

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.description=Bitwarden CLI
            org.opencontainers.image.source=https://github.com/icoretech/bitwarden-cli-docker
            org.opencontainers.image.title=bitwarden-cli
            org.opencontainers.image.vendor=iCoreTech, Inc.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BW_VERSION=${{ steps.version.outputs.version }}
          provenance: false
